<div class="report-page">
  <!-- HEADER -->
  <header class="top-bar">
    <div class="logo">
      <span class="logo-icon">tr</span>
      <span class="logo-train">▲</span>
      <span class="logo-text">inTrack</span>
    </div>
    
    <div class="header-actions">
      <span class="welcome-text" *ngIf="currentUser">
        Welcome, {{ currentUser.firstName }}!
      </span>
      <button class="btn-logout" (click)="logout()" *ngIf="currentUser">
        Logout
      </button>
    </div>
  </header>
  
  <!-- User Info -->
  <section class="user-section">
    <div class="avatar-placeholder"></div>
    <div class="user-info">
      <h2>User00</h2>
      <p><em>“User tagline for fun”</em></p>
    </div>
    <div class="datetime">
      <p>10-03-2025</p>
      <p>PHT 21:12:34 PM</p>
    </div>
  </section>

  <!-- Report Form -->
  <section class="report-form">
    <h3>Report a Problem</h3>

    <div class="field">
      <input type="text" placeholder="Title" class="input-title" />
    </div>

    <div class="field">
      <textarea placeholder="Body" class="input-body"></textarea>
    </div>

    <button class="btn-send">Send</button>
  </section>

 
  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button routerLink="/prediction" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="icon material-icons">bar_chart</i>
      <span>Prediction</span>
    </button>

    <button routerLink="/dashboard" routerLinkActive="active">
      <i class="icon material-icons">grid_view</i>
      <span>Dashboard</span>
    </button>

    <button routerLink="/report-problem" routerLinkActive="active">
      <i class="icon material-icons">report_problem</i>
      <span>Report</span>
    </button>
  </nav>
</div>
